<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foyer Zéro — maquette UI</title>
<style>
:root{
  /* Palette FICHE-STYLE.md v3 — aucune teinte hors liste */
  --k-trait:#161914;   --k-ombre:#343A2C;  --k-corps:#4E5742;
  --k-clair:#6A7658;   --k-lum:#8C9A72;
  --m-sombre:#1E2124;  --m-moyen:#3E454C;  --m-clair:#68727E;
  --ai-s:#928E80;      --ai-c:#F5F3E8;
  --av-s:#8A1E17;      --av-c:#E43E32;
  --aa-s:#A67018;      --aa-c:#F5B636;
  --cell:45px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;height:100%}
body{
  font-family:"Roboto Condensed","Segoe UI",system-ui,sans-serif;
  display:flex;align-items:flex-start;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
#app{
  width:360px;height:735px;          /* = 1080 x 2205 physiques en DPR 3 */
  background:var(--m-sombre);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  border:1px solid #000;
}

/* ---------- 1. ONGLETS — 40 ---------- */
.tabs{height:40px;flex:0 0 40px;display:flex;background:var(--k-trait);
      border-bottom:1px solid var(--m-moyen)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;
     font-size:12px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--m-clair);border-right:1px solid var(--m-sombre);cursor:pointer}
.tab:last-child{border-right:0}
.tab.on{color:var(--ai-c);background:var(--k-ombre);
        box-shadow:inset 0 -2px 0 var(--k-lum)}

/* ---------- 2. RESSOURCES — 37 ---------- */
.res{height:37px;flex:0 0 37px;display:flex;align-items:center;
     background:var(--k-ombre);border-bottom:1px solid var(--k-trait);padding:0 6px;gap:4px}
.r{flex:1;display:flex;flex-direction:column;justify-content:center;line-height:1}
.r b{font-size:14px;font-weight:600;color:var(--ai-c);font-variant-numeric:tabular-nums}
.r span{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--m-clair);margin-top:2px}
.r.scorie b{color:var(--aa-c)}
.r.cmd b{color:var(--k-lum)}

/* ---------- 3. POINTS D'ARMÉE — 28 ---------- */
.army{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:6px;
      padding:0 8px;background:var(--k-trait);border-bottom:1px solid var(--m-moyen)}
.army .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--m-clair)}
.bar{flex:1;height:6px;background:var(--m-sombre);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 42% 0 0;background:var(--k-lum)}
.army .val{font-size:11px;color:var(--ai-c);font-variant-numeric:tabular-nums}

/* ---------- 4. CHAMP — 405 (9 rangées de 45) ---------- */
.field{flex:0 0 405px;height:405px;position:relative;overflow:hidden;background:#0d0f0c}
.scroll{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;
        scrollbar-width:none;display:flex}
.scroll::-webkit-scrollbar{display:none}
.rail{width:6px;flex:0 0 6px;background:var(--m-sombre)}
.rail div{width:100%}
.rail .b-bat{height:360px;background:var(--k-corps)}
.rail .b-def{height:360px;background:var(--av-s)}
.rail .b-off{height:90px;background:var(--ai-s)}
.grid{flex:1;display:grid;grid-template-columns:repeat(8,1fr);
      grid-auto-rows:var(--cell)}
.c{border-right:1px solid rgba(104,114,126,.16);
   border-bottom:1px solid rgba(104,114,126,.16);
   position:relative;display:flex;align-items:center;justify-content:center}
.c:nth-child(8n){border-right:0}
/* bandes */
.bat{background:#12150f}
.def{background:#141610}
.off{background:#171a13}
/* jetons — carré=tourelle, vertical=véhicule, triangle=infanterie */
.tok{width:38px;height:38px;background:var(--k-corps);
     border:1px solid var(--k-trait);
     box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre);
     position:relative}
.tok.av{box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre),inset 0 0 0 3px var(--av-s)}
.tok.aa{box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre),inset 0 0 0 3px var(--aa-s)}
.tok.ai{box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre),inset 0 0 0 3px var(--ai-s)}
.tok.veh{width:28px;height:40px}
.tok.sel{outline:2px solid var(--ai-c);outline-offset:1px}
.lvl{position:absolute;right:1px;bottom:0;font-size:8px;color:var(--ai-c);
     text-shadow:0 1px 0 #000;line-height:1}
.rn{position:absolute;left:2px;top:1px;font-size:7px;color:rgba(104,114,126,.5);line-height:1}

/* ---------- 5. ACTIONS CONTEXTUELLES — 46 ---------- */
.ctx{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:5px;
     padding:0 6px;background:var(--k-ombre);border-top:1px solid var(--k-trait)}
.ctx .who{flex:0 0 82px;line-height:1.15}
.ctx .who b{display:block;font-size:11px;color:var(--ai-c)}
.ctx .who span{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--m-clair)}
.btn{flex:1;height:32px;display:flex;align-items:center;justify-content:center;
     font-size:10px;letter-spacing:.06em;text-transform:uppercase;
     background:var(--m-moyen);color:var(--ai-c);border:1px solid var(--k-trait);cursor:pointer}
.btn.up{background:var(--k-clair);color:var(--k-trait);font-weight:600}
.btn.sell{background:var(--m-sombre);color:var(--m-clair)}

/* ---------- 6. BANDES — 42 ---------- */
.bands{height:42px;flex:0 0 42px;display:flex;background:var(--k-trait);
       border-top:1px solid var(--m-moyen)}
.band{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;border-right:1px solid var(--m-sombre);cursor:pointer}
.band:last-child{border-right:0}
.band em{width:18px;height:3px;font-style:normal}
.band.bat em{background:var(--k-corps)}
.band.def em{background:var(--av-s)}
.band.off em{background:var(--ai-s)}
.band span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--m-clair)}
.band.on span{color:var(--ai-c)}
.band.on{background:var(--k-ombre)}

/* ---------- 7. SLOTS — 86 ---------- */
.slots{flex:0 0 86px;height:86px;display:grid;
       grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
       gap:4px;padding:5px 6px;background:var(--m-sombre);
       border-top:1px solid var(--k-trait)}
.slot{background:var(--k-ombre);border:1px solid var(--k-trait);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;position:relative;cursor:pointer}
.slot i{width:20px;height:20px;background:var(--k-corps);
        box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait);font-style:normal}
.slot.av i{box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait),inset 0 0 0 2px var(--av-s)}
.slot.aa i{box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait),inset 0 0 0 2px var(--aa-s)}
.slot.ai i{box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait),inset 0 0 0 2px var(--ai-s)}
.slot b{font-size:8px;color:var(--m-clair);letter-spacing:.06em;text-transform:uppercase}
.slot .cost{position:absolute;top:1px;right:3px;font-size:8px;color:var(--k-lum)}
.slot.vide{background:transparent;border:1px dashed var(--m-moyen)}
.slot.vide i{background:transparent;box-shadow:none}

/* règle de mesure (retirable) */
.ruler{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:9;
       font-size:7px;color:rgba(245,182,54,.55);display:none}
body.mesure .ruler{display:block}
.ruler div{position:absolute;left:2px;border-top:1px dashed rgba(245,182,54,.3);width:100%}
</style>
</head>
<body>
<div id="app">

  <!-- 1 -->
  <div class="tabs">
    <div class="tab on">Chantier</div>
    <div class="tab">Recherche</div>
    <div class="tab">Monde</div>
    <div class="tab">Options</div>
  </div>

  <!-- 2 -->
  <div class="res">
    <div class="r"><b>18 420</b><span>Quartz</span></div>
    <div class="r scorie"><b>6 105</b><span>Scorie</span></div>
    <div class="r"><b>+340</b><span>Énergie</span></div>
    <div class="r cmd"><b>187</b><span>Commande</span></div>
  </div>

  <!-- 3 -->
  <div class="army">
    <span class="lbl">Points d'armée</span>
    <div class="bar"><i></i></div>
    <span class="val">58 / 100</span>
  </div>

  <!-- 4 -->
  <div class="field">
    <div class="scroll" id="scroll">
      <div class="rail">
        <div class="b-bat"></div><div class="b-def"></div><div class="b-off"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- 5 -->
  <div class="ctx">
    <div class="who"><b>Fonderie</b><span>Niveau 7</span></div>
    <div class="btn">Réparer</div>
    <div class="btn up">Améliorer</div>
    <div class="btn sell">Démonter</div>
  </div>

  <!-- 6 -->
  <div class="bands">
    <div class="band bat on" data-y="0"><em></em><span>Chantier</span></div>
    <div class="band def" data-y="360"><em></em><span>Défense</span></div>
    <div class="band off" data-y="720"><em></em><span>Assaut</span></div>
  </div>

  <!-- 7 -->
  <div class="slots">
    <div class="slot ai"><span class="cost">5</span><i></i><b>Fantassin</b></div>
    <div class="slot av"><span class="cost">10</span><i></i><b>Bélier</b></div>
    <div class="slot aa"><span class="cost">10</span><i></i><b>Herse</b></div>
    <div class="slot av"><span class="cost">15</span><i></i><b>Enclume</b></div>
    <div class="slot ai"><span class="cost">5</span><i></i><b>Éclaireur</b></div>
    <div class="slot aa"><span class="cost">15</span><i></i><b>Vigie</b></div>
    <div class="slot vide"><i></i><b>—</b></div>
    <div class="slot vide"><i></i><b>—</b></div>
  </div>

</div>

<script>
/* Champ : 18 rangées, numérotées 1 (bas, attaquant) → 18 (haut, le fond).
   Bandes : 11-18 bâtiments · 3-10 défense · 1-2 déploiement. */
const g = document.getElementById('grid');
const OCC = {
  '17-2':['tok','',''], '17-5':['tok','',''],
  '15-1':['tok','',''], '15-3':['tok','sel',''], '15-6':['tok','',''],
  '13-4':['tok','',''], '12-2':['tok','',''], '12-7':['tok','',''],
  '9-1':['tok','av',''], '9-4':['tok','ai',''], '9-6':['tok','aa',''],
  '7-2':['tok','av',''], '7-5':['tok','ai',''],
  '5-3':['tok','aa',''], '5-7':['tok','av',''],
  '2-2':['tok veh','av',''], '2-4':['tok veh','ai',''], '1-5':['tok veh','aa','']
};
let html = '';
for (let r = 18; r >= 1; r--) {
  const bande = r >= 11 ? 'bat' : (r >= 3 ? 'def' : 'off');
  for (let c = 1; c <= 8; c++) {
    const k = r + '-' + c, o = OCC[k];
    html += '<div class="c ' + bande + '">'
          + (c === 1 ? '<span class="rn">' + r + '</span>' : '')
          + (o ? '<div class="' + o[0] + ' ' + o[1] + '"><span class="lvl">' + (3 + (r % 6)) + '</span></div>' : '')
          + '</div>';
  }
}
g.innerHTML = html;

/* Boutons de bande = saut dans le champ, pas d'écran séparé. */
const sc = document.getElementById('scroll');
document.querySelectorAll('.band').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.band').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    sc.scrollTo({ top: +b.dataset.y });
  });
});
/* La bande active suit le défilement manuel. */
sc.addEventListener('scroll', () => {
  const y = sc.scrollTop, i = y > 600 ? 2 : (y > 240 ? 1 : 0);
  const bs = document.querySelectorAll('.band');
  if (!bs[i].classList.contains('on')) {
    bs.forEach(x => x.classList.remove('on'));
    bs[i].classList.add('on');
  }
});
</script>
</body>
</html>
