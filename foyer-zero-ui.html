<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foyer Zéro — maquette UI</title>
<!--
  MAQUETTE. Pas un livrable, pas une source du build. Le jeu est
  src/index.src.html. Ce fichier sert à REGARDER une décision d'interface avant
  de l'écrire, sur un téléphone.

  ⚠ RÉVISION DU 27/08/2026. La version précédente mentait sur six points, tous
  mesurés contre les tables du dépôt :
    — grille en 8 colonnes ; elle fait 9 (GRILLE.largeur, data/combat.js) ;
    — une ressource « Commande » qui n'existe pas ; il y en a trois — quartz,
      scorie, électricité (RESSOURCES, sim/economie-base.js) ;
    — un bâtiment « Fonderie » absent des onze de data/base.js ;
    — des unités « Fantassin », « Herse », « Vigie » qui n'existent nulle part ;
    — « Bélier » et « Enclume » dans un panneau JOUEUR, alors que ce sont des
      noms OUVRAGE — CLAUDE.md §4 interdit de mélanger les deux jeux de noms ;
    — aucun champ de ressource, alors qu'ils sont le socle des collecteurs.

  ⚠ PALETTE : LES QUATORZE TEINTES DE FICHE-STYLE.md, ET RIEN D'AUTRE.
  Pas d'alpha, pas de gris intermediaire, pas de raccourci a trois chiffres.
  C'est la regle que banc.test.js impose deja a src/ui/ et a index.src.html, et
  la maquette s'y plie AVANT l'ecran plutot qu'apres : une maquette qui propose
  une teinte interdite fait ecrire un ecran qui ne passera pas la garde.
  Deux consequences visibles, et elles valent mieux que ce qu'elles remplacent :
    — les trois bandes n'ont plus de fond propre. La fiche n'a pas trois gris
      voisins, et le RAIL disait deja ou l'on est. Une nuance de noir ne se
      distingue de toute facon pas sur un telephone au soleil.
    — un champ de ressource n'est plus une teinte pale : c'est un fond kaki
      plein, avec un lisere qui dit la ressource — os pour le quartz, ambre
      pour la scorie.
  ⚠ Un hex a huit chiffres passerait entre les deux motifs de la garde. Ne pas
  s'en servir : contourner un garde-fou en silence coute plus cher que la
  contrainte qu'il pose.

  ⚠ REVISION DU 27/08/2026 (soir), lot ECRAN-NAVIGATION. Deux corrections de
  navigation, releves sur l'ecran reel essaye sur GitHub Pages :
    — la grille est RETOURNEE : la rangee 18 tombe en premiere ligne d'ecran,
      donc la base d'abord, puis la defense, puis les deux rangees de
      deploiement. Le modele ne bouge pas, c'est l'affichage qui se retourne ;
    — la barre du bas porte DEUX bandes et non trois. Le bouton « Assaut »
      pointait sur les rangees 1-2, ou les vagues PARAISSENT pendant un combat
      et non ou on les COMPOSE : il promettait un editeur et livrait du sol nu.
      La composition a son propre ecran dans le jeu ; la maquette n'en porte
      qu'un renvoi, et c'est un ecart assume — voir RAPPORT-ECRAN-NAVIGATION.md.

  ⚠ LES CAPACITÉS ONT MONTÉ DE 50 · 50 · 40 LE 27/08 AU SOIR. C'est la POCHE du
  Chantier de construction — feuille EFFETS ligne 14 du classeur, transcrite ce
  jour-là. Elle a débloqué une partie qui, sans elle, ne pouvait rien produire :
  un Chantier niveau 1 laisse UN emplacement libre, et produire en demande deux.
  Les débits, eux, n'ont pas bougé d'une unité : une poche stocke, elle ne
  produit pas.

  ⚠ TOUS LES CHIFFRES DE CETTE PAGE SORTENT DU MOTEUR. Terrain :
  champsDeLaBase(275, 16), la case de départ. Disposition : onze bâtiments
  passés à problemesDeDisposition() → aucun problème. Débits :
  debitsMilliParHeure(). Capacités : capacitesMilli(). Niveau des bâtiments :
  niveauDesBatiments() → 46 dixièmes, affiché 4,6. Relevé le 27/08/2026.
-->
<style>
:root{
  /* Palette FICHE-STYLE.md v3 — aucune teinte hors liste */
  --k-trait:#161914;   --k-ombre:#343A2C;  --k-corps:#4E5742;
  --k-clair:#6A7658;   --k-lum:#8C9A72;
  --m-sombre:#1E2124;  --m-moyen:#3E454C;  --m-clair:#68727E;
  --ai-s:#928E80;      --ai-c:#F5F3E8;
  --av-s:#8A1E17;      --av-c:#E43E32;
  --aa-s:#A67018;      --aa-c:#F5B636;
  /* 9 colonnes : rail 9 + 9 x 39 = 360. La cellule est CARRÉE. */
  --cell:39px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#161914;height:100%}
body{
  font-family:"Roboto Condensed","Segoe UI",system-ui,sans-serif;
  display:flex;align-items:flex-start;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
#app{
  width:360px;height:735px;          /* = 1080 x 2205 physiques en DPR 3 */
  background:var(--m-sombre);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  border:1px solid var(--k-trait);
}

/* ---------- 1. ONGLETS — 40 ---------- */
.tabs{height:40px;flex:0 0 40px;display:flex;background:var(--k-trait);
      border-bottom:1px solid var(--m-moyen)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;
     font-size:12px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--m-clair);border-right:1px solid var(--m-sombre);cursor:pointer}
.tab:last-child{border-right:0}
.tab.on{color:var(--ai-c);background:var(--k-ombre);
        box-shadow:inset 0 -2px 0 var(--k-lum)}
.tab.futur{color:#3E454C}

/* ---------- 2. RESSOURCES — 44 ---------- */
/* Trois ressources, pas quatre. Chacune montre son STOCK, sa CAPACITE et son
   debit horaire : sans la capacite, un stock qui plafonne est illisible — et
   un stock au-dessus du plafond est GELE, jamais ampute. */
.res{height:44px;flex:0 0 44px;display:flex;align-items:center;
     background:var(--k-ombre);border-bottom:1px solid var(--k-trait);padding:0 6px;gap:4px}
.r{flex:1;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.r .ligne{display:flex;align-items:baseline;gap:3px}
.r b{font-size:14px;font-weight:600;color:var(--ai-c);font-variant-numeric:tabular-nums}
.r .cap{font-size:8px;color:var(--m-clair);font-variant-numeric:tabular-nums}
.r span.nom{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--m-clair)}
.r .deb{font-size:8px;color:var(--k-lum);font-variant-numeric:tabular-nums}
.r.scorie b{color:var(--aa-c)}
.r.elec b{color:var(--k-lum)}

/* ---------- 3. EMPLACEMENTS — 26 ---------- */
/* Remplace la barre « points d'armee » : sur l'onglet Chantier, la ressource
   rare n'est pas l'armee, c'est l'emplacement ouvert par le Chantier. */
.army{height:26px;flex:0 0 26px;display:flex;align-items:center;gap:6px;
      padding:0 8px;background:var(--k-trait);border-bottom:1px solid var(--m-moyen)}
.army .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--m-clair)}
.bar{flex:1;height:6px;background:var(--m-sombre);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 8.4% 0 0;background:var(--k-lum)}
.army .val{font-size:11px;color:var(--ai-c);font-variant-numeric:tabular-nums}

/* ---------- 4. CHAMP — tout le reste ---------- */
.field{flex:1;position:relative;overflow:hidden;background:#161914}
.scroll{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;
        scrollbar-width:none;display:flex}
.scroll::-webkit-scrollbar{display:none}
.rail{width:9px;flex:0 0 9px;background:var(--m-sombre)}
.rail div{width:100%}
.rail .b-off{height:78px;background:var(--ai-s)}     /* rangees  1-2  */
.rail .b-def{height:312px;background:var(--av-s)}    /* rangees  3-10 */
.rail .b-bat{height:312px;background:var(--k-corps)} /* rangees 11-18 */
.grid{flex:1;display:grid;grid-template-columns:repeat(9,1fr);
      grid-auto-rows:var(--cell)}
/* Les cases portent leur ligne d'ecran en style : le miroir se lit dans le
   script, pas dans un ordre d'emission qu'on devrait deviner. */
.c{border-right:1px solid var(--k-ombre);
   border-bottom:1px solid var(--k-ombre);
   position:relative;display:flex;align-items:center;justify-content:center}
.c:nth-child(9n){border-right:0}
/* Aucun fond par bande : la fiche n'a pas trois gris voisins, et le RAIL dit
   deja ou l'on est. Une bande se lit a son rail et a son bouton, pas a une
   nuance de noir que personne ne distingue sur un telephone au soleil. */
/* CHAMPS DE RESSOURCE — sous les batiments, jamais au-dessus. Seul le
   collecteur peut s'y poser, et c'est le champ qui decide de sa ressource. */
.c.champ{background:var(--k-ombre)}
.c.champ::before{content:'';position:absolute;inset:2px;border:1px dashed}
.c.quartz::before{border-color:var(--ai-c)}
.c.scorie::before{border-color:var(--aa-c)}
/* jetons */
.tok{width:33px;height:33px;background:var(--k-corps);
     border:1px solid var(--k-trait);
     box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre);
     position:relative;display:flex;align-items:center;justify-content:center;
     font-size:9px;font-weight:600;color:var(--ai-c);letter-spacing:.02em}
.tok.prod{box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre),inset 0 0 0 2px var(--ai-s)}
.tok.mil{box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre),inset 0 0 0 2px var(--av-s)}
.tok.pivot{box-shadow:inset 0 2px 0 var(--k-lum),inset 0 -3px 0 var(--k-ombre),inset 0 0 0 2px var(--aa-s)}
.tok.sel{outline:2px solid var(--ai-c);outline-offset:1px}
.lvl{position:absolute;right:0;bottom:-1px;font-size:8px;color:var(--ai-c);
     text-shadow:0 1px 0 var(--k-trait);line-height:1;font-weight:400}
.rn{position:absolute;left:1px;top:0;font-size:7px;color:var(--m-clair);line-height:1}
.libre{width:11px;height:11px;border:1px dashed var(--k-clair);opacity:.6}

/* ---------- 5. ACTIONS CONTEXTUELLES — 46 ---------- */
.ctx{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:3px;
     padding:0 4px;background:var(--k-ombre);border-top:1px solid var(--k-trait)}
.ctx .who{flex:0 0 76px;min-width:0;line-height:1.15}
.ctx .who b{display:block;font-size:10px;color:var(--ai-c)}
.ctx .who span{display:block;font-size:7px;letter-spacing:.04em;color:var(--m-clair)}
.ctx .who b,.ctx .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ⚠ QUATRE BOUTONS DANS 46 px, ET LA BARRE N'A PAS GRANDI (28/08). Le lot
   POSE-ET-DEPLACEMENT a ajoute « Deplacer » entre « Ameliorer » et « Demolir » ;
   la consigne d'Ethan — « tu compresses tout dans l'ui » — interdisait de faire
   grandir la barre. Ce sont les ecarts, le bloc de gauche et le corps du texte
   qui ont cede : gap 5 → 3, who 100 → 76 px, font 10 → 9 px. La maquette suit
   l'ecran a l'identique, sans quoi elle enseignerait une barre a trois boutons
   que le jeu ne fait plus. */
.btn{flex:1;min-width:0;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-size:9px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;padding:0 1px;
     background:var(--m-moyen);color:var(--ai-c);border:1px solid var(--k-trait);cursor:pointer}
.btn em{font-style:normal;font-size:7px;color:var(--k-lum);letter-spacing:0;text-transform:none}
.btn.up{background:var(--k-clair);color:var(--k-trait);font-weight:600}
.btn.up em{color:var(--k-trait)}
.btn.sell{background:var(--m-sombre);color:var(--m-clair)}

/* ---------- 6. BANDES — 46 ---------- */
/* Chaque bande porte SON niveau : ce sont les trois niveaux du joueur, et
   c'est le seul endroit ou ils se lisent tous les trois d'un coup. */
.bands{height:46px;flex:0 0 46px;display:flex;background:var(--k-trait);
       border-top:1px solid var(--m-moyen)}
.band{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1px;border-right:1px solid var(--m-sombre);cursor:pointer}
.band:last-child{border-right:0}
.band em{width:18px;height:3px;font-style:normal}
.band.bat em{background:var(--k-corps)}
.band.def em{background:var(--av-s)}
.band.off em{background:var(--ai-s)}
.band span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--m-clair)}
.band i{font-style:normal;font-size:11px;color:var(--m-clair);font-variant-numeric:tabular-nums}
.band.on span,.band.on i{color:var(--ai-c)}
.band.on{background:var(--k-ombre)}
.band.vide i{color:#3E454C}
/* La bascule entre bases — une barre de 26 px sous les ressources. */
.nav { flex: 0 0 26px; display: flex; align-items: center; background: #1E2124; border-bottom: 1px solid #161914; }
.nav .fleche { flex: 0 0 44px; text-align: center; color: #8C9A72; font-size: 12px; opacity: 0.45; }
.nav .ou { flex: 1; text-align: center; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #68727E; }
.band.off em { background: #8A1E17; }

/* Le saut vers l'ecran Offense n'est PAS une troisieme bande : un filet le
   separe, une fleche dit qu'il emmene ailleurs, et il ne porte pas de niveau.
   C'est ce qui manquait au bouton « Assaut », qui avait l'air d'une bande et
   faisait defiler vers deux rangees de sol nu. */
.saut{flex:0 0 auto;display:flex;align-items:center;padding:0 10px;
      background:var(--k-ombre);color:var(--ai-c);border-left:2px solid var(--m-moyen);
      font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}

/* ---------- 7. SLOTS — 86 ---------- */
.slots{flex:0 0 86px;height:86px;display:grid;
       grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
       gap:4px;padding:5px 6px;background:var(--m-sombre);
       border-top:1px solid var(--k-trait)}
.slot{background:var(--k-ombre);border:1px solid var(--k-trait);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;position:relative;cursor:pointer;padding:0 2px}
.slot i{width:18px;height:18px;background:var(--k-corps);
        box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait);font-style:normal}
.slot.prod i{box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait),inset 0 0 0 2px var(--ai-s)}
.slot.mil i{box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait),inset 0 0 0 2px var(--av-s)}
.slot.pivot i{box-shadow:inset 0 1px 0 var(--k-lum),inset 0 -2px 0 var(--k-trait),inset 0 0 0 2px var(--aa-s)}
.slot b{font-size:7px;color:var(--m-clair);letter-spacing:.03em;text-transform:uppercase;
        text-align:center;line-height:1.05}
.slot .cost{position:absolute;top:1px;right:3px;font-size:8px;color:var(--k-lum)}
.slot.vide{background:transparent;border:1px dashed var(--m-moyen)}
.slot.vide i{background:transparent;box-shadow:none}
</style>
</head>
<body>
<div id="app">

  <div class="tabs">
    <div class="tab on">Base</div>
    <div class="tab futur">Mission</div>
    <div class="tab futur">Recherche</div>
    <div class="tab futur">Monde</div>
    <div class="tab">Options</div>
  </div>

  <!-- La bascule entre bases, ajoutee le 28/08. Une seule base existe : les
       deux fleches sont eteintes et le libelle dit pourquoi. -->
  <div class="nav">
    <span class="fleche">◀</span>
    <span class="ou">Base 1 / 1</span>
    <span class="fleche">▶</span>
  </div>

  <div class="res">
    <div class="r">
      <div class="ligne"><b>418</b><span class="cap">/ 473</span></div>
      <div class="ligne"><span class="nom">Quartz</span><span class="deb">+2 250/h</span></div>
    </div>
    <div class="r scorie">
      <div class="ligne"><b>165</b><span class="cap">/ 473</span></div>
      <div class="ligne"><span class="nom">Scorie</span><span class="deb">+1 876/h</span></div>
    </div>
    <div class="r elec">
      <div class="ligne"><b>89</b><span class="cap">/ 182</span></div>
      <div class="ligne"><span class="nom">Élec.</span><span class="deb">+567/h</span></div>
    </div>
  </div>

  <div class="army">
    <span class="lbl">Emplacements</span>
    <div class="bar"><i></i></div>
    <span class="val">11 / 12</span>
  </div>

  <div class="field">
    <div class="scroll" id="scroll">
      <div class="rail">
        <div class="b-bat"></div><div class="b-def"></div><div class="b-off"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="ctx">
    <div class="who"><b>Raffinerie</b><span>Niv. 5 · +176 q +352 s /h</span></div>
    <div class="btn">Réparer</div>
    <div class="btn up">Améliorer<em>vers niv. 6</em></div>
    <div class="btn">Déplacer</div>
    <div class="btn sell">Démolir</div>
  </div>

  <!-- ⚠ TROIS BOUTONS EGAUX, ET LA BARRE EST ENTIERE (28/08). Elle portait deux
       bandes, le numero de version et un saut vers l'Offense separe par un
       filet. Ethan a tranche : « les boutons base defense offense doivent
       prendre toutes la place en bas ». Le numero de version est parti dans les
       Options. La maquette suit, sinon elle enseignerait une navigation que le
       jeu ne fait plus — c'est la lecon du retournement du 27/08. -->
  <div class="bands">
    <div class="band bat on" data-y="0"><em></em><span>Base</span><i>4,6</i></div>
    <div class="band def vide" data-y="312"><em></em><span>Défense</span><i>—</i></div>
    <div class="band off vide"><em></em><span>Offense</span><i>—</i></div>
  </div>

  <div class="slots" id="slots"></div>

</div>

<script>
/* Grille : 9 colonnes x 18 rangees. Rangee 1 = le bord d'ou arrivent les
   vagues, rangee 18 = LE FOND, ou se tient le Chantier. Ne jamais dire
   « en haut ». Bandes : 1-2 deploiement, 3-10 defense, 11-18 batiments. */

/* Terrain reel de la case de depart — champsDeLaBase(275, 16). Douze cases,
   entre les rangees 12 et 17, colonnes 2 a 8, jamais sur le pourtour. */
const CHAMPS = [
  [12,5,'scorie'],[13,2,'quartz'],[14,2,'quartz'],[14,3,'quartz'],
  [14,6,'scorie'],[14,7,'scorie'],[15,5,'scorie'],[16,7,'quartz'],
  [17,2,'scorie'],[17,3,'scorie'],[17,6,'quartz'],[17,7,'quartz']
];

/* Onze batiments, passes a problemesDeDisposition() → aucun probleme. Le
   libelle court est un raccourci d'affichage ; le nom entier est celui de
   data/base.js et c'est lui qui s'affiche dans le bandeau contextuel. */
const BATIS = [
  [18,5,'CHA','Chantier de construction',6,'pivot'],
  [13,2,'COL','Collecteur',6,'prod'],
  [14,2,'COL','Collecteur',6,'prod'],
  [14,6,'COL','Collecteur',5,'prod'],
  [14,7,'COL','Collecteur',5,'prod'],
  [16,7,'COL','Collecteur',4,'prod'],
  [15,6,'RAF','Raffinerie',5,'prod'],
  [16,5,'CEN','Centrale',4,'prod'],
  [17,5,'ACC','Accumulateur',3,'prod'],
  [18,3,'CAS','Caserne',4,'mil'],
  [18,7,'CPX','Complexe de défense',3,'mil']
];
/* Le douzieme emplacement, ouvert et encore libre. */
const LIBRE = [18,4];
const SELECTION = [15,6];

const champDe = {}, batiDe = {};
for (const t of CHAMPS) champDe[t[0]+'-'+t[1]] = t[2];
for (const b of BATIS) batiDe[b[0]+'-'+b[1]] = b;

let html = '';
for (let r = 1; r <= 18; r++) {
  const bande = r <= 2 ? 'off' : (r <= 10 ? 'def' : 'bat');
  for (let c = 1; c <= 9; c++) {
    const k = r + '-' + c, res = champDe[k], b = batiDe[k];
    let cls = 'c ' + bande;
    if (res) cls += ' champ ' + res;
    let dedans = (c === 1 ? '<span class="rn">' + r + '</span>' : '');
    if (b) {
      const sel = (b[0] === SELECTION[0] && b[1] === SELECTION[1]) ? ' sel' : '';
      dedans += '<div class="tok ' + b[5] + sel + '">' + b[2]
              + '<span class="lvl">' + b[4] + '</span></div>';
    } else if (r === LIBRE[0] && c === LIBRE[1]) {
      dedans += '<div class="libre"></div>';
    }
    // MIROIR : ligne d'ecran = 18 + 1 - rangee. La rangee 18 tombe donc en
    // premiere ligne, et la rangee 1 en derniere. Le modele ne bouge pas — la
    // rangee 1 reste celle d'ou arrivent les vagues, c'est l'AFFICHAGE qui se
    // retourne. Meme transformation que render/orientation.js dans le jeu.
    const style = 'grid-column:' + c + ';grid-row:' + (19 - r);
    html += '<div class="' + cls + '" style="' + style + '">' + dedans + '</div>';
  }
}
document.getElementById('grid').innerHTML = html;

/* Ce qu'on peut poser sur l'emplacement libre : des batiments de data/base.js,
   sous leur vrai nom. Le cout affiche est celui du niveau 2 — le niveau 1 est
   gratuit pour tous (COUT_NIVEAU_DEUX). */
const POSABLES = [
  ['Collecteur','prod',3],['Raffinerie','prod',2],
  ['Centrale','prod',3],['Accumulateur','prod',2],
  ['Caserne','mil',5],['Dépôt de véhicules','mil',5],
  ['Aérodrome','mil',5],['Complexe de défense','mil',5]
];
document.getElementById('slots').innerHTML = POSABLES.map(function (p) {
  return '<div class="slot ' + p[1] + '"><span class="cost">' + p[2]
       + '</span><i></i><b>' + p[0] + '</b></div>';
}).join('');

/* Boutons de bande = saut dans le champ, pas d'ecran separe. C'est l'idee que
   la maquette precedente apportait, et elle est gardee telle quelle. */
const sc = document.getElementById('scroll');
document.querySelectorAll('.band').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.band').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    sc.scrollTo({ top: +b.dataset.y });
  });
});
/* La bande active suit le defilement manuel. Seuils = hauteurs de bande en
   pixels : 2 rangees puis 8, a 39 px la rangee. */
sc.addEventListener('scroll', function () {
  // Deux bandes : les 8 rangees de batiments occupent les 312 premiers pixels.
  const y = sc.scrollTop, i = y >= 300 ? 1 : 0;
  const bs = document.querySelectorAll('.band');
  if (!bs[i].classList.contains('on')) {
    bs.forEach(function (x) { x.classList.remove('on'); });
    bs[i].classList.add('on');
  }
});
// Le jeu s'ouvre sur la base, qui est desormais en tete du champ.
sc.scrollTo({ top: 0 });
</script>
</body>
</html>
