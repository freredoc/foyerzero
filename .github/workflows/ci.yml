# CI de Foyer Zéro.
#
#   web      npm ci → build → tests Node → artefact HTML
#   android  tests JVM du module :maj → APK (signé si les secrets existent,
#            non signé sinon — le workflow n'échoue pas sans secrets)
#   pages    sur main uniquement : HTML rebuildé DANS le job + manifeste
#            généré à partir de CE HTML, publiés ensemble sur GitHub Pages.
#            dist/ n'est jamais commité : la désynchronisation code/livrable
#            comme manifeste/HTML est structurellement impossible.
#
# Le keystore de signature ne vit QUE dans les secrets GitHub Actions :
# FOYERZERO_KEYSTORE_BASE64, FOYERZERO_KEYSTORE_PASSWORD, FOYERZERO_KEY_ALIAS,
# FOYERZERO_KEY_PASSWORD. Jamais dans le dépôt, ni en clair ni chiffré.
name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: foyerzero-html
          path: dist/index.html

  android:
    runs-on: ubuntu-latest
    # Les secrets ne sont pas lisibles dans le « if » d'un step
    # (Unrecognized named-value: 'secrets') : ils passent par l'env du job,
    # et les steps testent env.* — vides quand les secrets n'existent pas.
    env:
      FOYERZERO_KEYSTORE_BASE64: ${{ secrets.FOYERZERO_KEYSTORE_BASE64 }}
      FOYERZERO_KEYSTORE_PASSWORD: ${{ secrets.FOYERZERO_KEYSTORE_PASSWORD }}
      FOYERZERO_KEY_ALIAS: ${{ secrets.FOYERZERO_KEY_ALIAS }}
      FOYERZERO_KEY_PASSWORD: ${{ secrets.FOYERZERO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Le HTML embarqué dans l'APK est buildé dans CE job, pas repris d'un
      # commit ni d'un artefact.
      - run: npm ci
      - run: node tools/build.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Tests JVM de la logique de mise à jour
        run: gradle -p android :maj:test
      - name: Préparer la signature (uniquement si les secrets existent)
        if: ${{ github.event_name == 'push' && env.FOYERZERO_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$FOYERZERO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/foyerzero.jks"
          echo "FOYERZERO_KEYSTORE=$RUNNER_TEMP/foyerzero.jks" >> "$GITHUB_ENV"
      - name: Construire l'APK release
        run: gradle -p android :app:assembleRelease
      # ⚠ UN APK NON SIGNÉ NE S'INSTALLE PAS, et le job passait au vert quand
      # même : constaté le 27/08 sur l'appareil de test. Gradle nomme le
      # fichier « app-release-unsigned.apk » dans ce cas — c'est le seul indice,
      # et il fallait ouvrir l'artefact pour le voir. Le CI le dit maintenant.
      - name: Refuser un APK non signé
        run: |
          if ls android/app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::APK NON SIGNÉ — il ne s'installera pas. Ni les secrets"\
              "FOYERZERO_KEYSTORE_* ni le repli de signature debug n'ont pris."
            exit 1
          fi
          ls -l android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: foyerzero-apk
          path: android/app/build/outputs/apk/release/*.apk

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build.js
      - run: npm test
      - name: Générer le manifeste à partir du HTML de CE job
        run: |
          mkdir -p site
          cp dist/index.html site/
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(node -p "require('./package.json').config.build")
          SHA=$(sha256sum dist/index.html | cut -d' ' -f1)
          # Le nom du dépôt est LU du contexte, jamais écrit en dur : l'URL
          # reste juste même si le dépôt est renommé (l'allowlist du client,
          # elle, est volontairement en dur — la faire suivre en cas de
          # nouveau renommage).
          URL="https://freredoc.github.io/${GITHUB_REPOSITORY#*/}/index.html"
          printf '{ "version": "%s", "build": %s, "sha256": "%s", "url": "%s" }\n' \
            "$VERSION" "$BUILD" "$SHA" "$URL" > site/manifest.json
          cat site/manifest.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
