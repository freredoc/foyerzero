<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=360,initial-scale=1">
<title>Maquette quinconce 360 px</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:360px;min-height:450px;background:#11140f;color:#f5f3e8;font-family:system-ui,sans-serif}body{padding:10px 6px}.entete{margin-bottom:8px;padding:8px;background:#343a2c;border:1px solid #4e5742}.entete b{font-size:13px;letter-spacing:.12em}.entete p{margin:4px 0 0;color:#aab38e;font-size:10px}.vague{position:relative;width:70%;margin:0 auto 5px}.vague h2{position:absolute;z-index:1;left:34%;top:1px;margin:0;font-size:9px;letter-spacing:.1em;color:#aab38e}.rangee{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(3,auto);column-gap:3px;row-gap:0;padding-bottom:5.2%;width:100%}.case{position:relative;aspect-ratio:1;margin-bottom:-50%;overflow:hidden;border:1px solid #4e5742;background:#252a22}.sprite{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);image-rendering:pixelated}.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.niveau{position:absolute;z-index:2;right:1px;bottom:0;color:#fff4bb;font:bold 9px/10px system-ui;text-shadow:0 1px #161914}.mesure{margin-top:7px;padding:7px;background:#1e2124;border-left:3px solid #f5b636;color:#cdd4ba;font-size:10px;line-height:1.3}.mesure b{color:#f5b636}
</style>
<body><div class="entete"><b>OFFENSE · QUINCONCE</b><p>Android 360 px · 4 vagues × 9 · 3 en haut, 3 au centre, 3 en bas</p></div><main id="vagues"></main><div class="mesure"><b>70 % centraux · 96 % maximum</b> — les unités restent entre les murs. Les neuf colonnes restent celles du combat ; seule leur hauteur d’affichage change.</div>
<script>
const racine='../art/sprites/';
const lourds=[
 ['belier','chassis/64/off_j_belier_chassis.png','tourelle-unite/64/off_j_belier_tourelle.png'],
 ['broyeur','chassis/64/off_j_broyeur_chassis.png','tourelle-unite/64/off_j_broyeur_tourelle.png'],
 ['fendeur','chassis/64/off_j_fendeur_chassis.png','tourelle-unite/64/off_j_fendeur_tourelle.png'],
 ['enclume','unite/64/off_j_enclume.png',null],
 ['busard','unite/64/off_j_busard.png',null]
];
const h=document.querySelector('#vagues');
for(let v=1;v<=4;v++){
 const bloc=document.createElement('section');bloc.className='vague';
 bloc.innerHTML=`<h2>VAGUE D’ATTAQUE ${v}</h2><div class="rangee"></div>`;
 const r=bloc.querySelector('.rangee');
 for(let c=1;c<=9;c++){
  const [nom,chassis,tourelle]=lourds[(c+v)%lourds.length];
  const e=document.createElement('div');e.className='case';e.title=nom;e.style.gridColumn=String(c);e.style.gridRow=String(Math.ceil(c/3));
  e.innerHTML=`<div class="sprite"><img src="${racine+chassis}">${tourelle?`<img src="${racine+tourelle}">`:''}</div><i class="niveau">${40+((c+v)%11)}</i>`;
  r.append(e);
 }
 h.append(bloc);
}
</script></body></html>
