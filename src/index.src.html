<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foyer Zéro — banc d'essai</title>
<style>
  /* Palette : FICHE-STYLE.md §3, aucune teinte hors de la fiche.
     Les accents fonctionnels sont réservés aux entités — l'interface
     s'habille en kaki et en métal. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* `hidden` est posé par le JS sur des blocs dont le sélecteur d'id fixe
     un `display` : un id l'emporte sur la règle `[hidden]` de la feuille
     par défaut, et l'attribut n'aurait plus aucun effet. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #161914;
    color: #8C9A72;
    font-family: system-ui, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    background: #1E2124;
    border-bottom: 1px solid #343A2C;
  }
  header h1 {
    margin: 0 8px 0 0;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #8C9A72;
  }
  header .version { color: #68727E; font-size: 0.8rem; margin-right: 8px; }
  label { display: inline-flex; align-items: center; gap: 4px; color: #68727E; }
  select, input, button {
    background: #343A2C;
    color: #8C9A72;
    border: 1px solid #4E5742;
    border-radius: 3px;
    padding: 4px 8px;
    font: inherit;
  }
  input[type="number"] { width: 5em; }
  button { cursor: pointer; }
  button:active { background: #4E5742; }
  button.actif { background: #6A7658; color: #161914; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #banc-canvas {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: block;
    /* Jamais de zoom ni de transform: scale ici : le buffer et la géométrie
       doivent rester d'accord. Le letterboxing vit dans la projection. */
  }
  #banc-canvas { cursor: crosshair; touch-action: manipulation; }
  #banc-statut {
    padding: 4px 8px;
    color: #68727E;
    background: #1E2124;
    border-top: 1px solid #343A2C;
  }
  #banc-fin {
    padding: 8px;
    background: #1E2124;
    border-top: 1px solid #4E5742;
  }
  #banc-fin h2 { margin: 0 0 4px; font-size: 1rem; color: #8C9A72; }
  #banc-fin p { margin: 2px 0; }
  #banc-tick {
    max-height: 30dvh;
    overflow-y: auto;
    background: #1E2124;
  }
  #banc-tick table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
  #banc-tick th, #banc-tick td {
    text-align: left;
    padding: 2px 6px;
    border-bottom: 1px solid #343A2C;
  }
  #banc-tick th { color: #68727E; position: sticky; top: 0; background: #1E2124; }

  /* --- Arsenal, lot 5A --- */
  #banc-arsenal {
    padding: 6px 8px;
    background: #1E2124;
    border-top: 1px solid #4E5742;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  #banc-arsenal .palette { display: flex; flex-wrap: wrap; gap: 4px; }
  #banc-arsenal button.unite {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
    padding: 3px 7px;
    min-width: 4.5em;
  }
  #banc-arsenal button.unite .cout { color: #68727E; font-size: 0.75rem; }
  #banc-arsenal button.unite.actif .cout { color: #343A2C; }
  #banc-compteur { color: #8C9A72; margin-left: auto; white-space: nowrap; }
  #banc-compteur.depasse { color: #E43E32; }

  /* --- Défense, lot 5C : jumeau du bloc d'Arsenal --- */
  #banc-defense {
    padding: 6px 8px;
    background: #1E2124;
    border-top: 1px solid #4E5742;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  #banc-defense .palette { display: flex; flex-wrap: wrap; gap: 4px; }
  #banc-defense button.unite {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
    padding: 3px 7px;
    min-width: 4.5em;
  }
  #banc-defense button.unite .cout { color: #68727E; font-size: 0.75rem; }
  #banc-defense button.unite.actif .cout { color: #343A2C; }
  #banc-compteur-defense { color: #8C9A72; margin-left: auto; white-space: nowrap; }
  #banc-compteur-defense.depasse { color: #E43E32; }
  /* Le sens Défense est grisé sous le niveau 10 : encore faut-il que ça se
     VOIE. Règle générale, aucun contrôle désactivé ne doit passer pour vif. */
  select:disabled, button:disabled, option:disabled { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Foyer Zéro</h1>
  <span class="version">banc d'essai · v%VERSION% b%BUILD%</span>
  <label>type
    <select id="banc-type">
      <option value="camp">camp</option>
      <option value="avantPoste">avant-poste</option>
      <option value="base">base</option>
    </select>
  </label>
  <label>niveau <input id="banc-niveau" type="number" min="1" max="50" value="10"></label>
  <label>saveur
    <select id="banc-saveur">
      <option value="aucune">aucune</option>
      <option value="richeQuartz">riche en quartz</option>
      <option value="richeScorie">riche en scorie</option>
    </select>
  </label>
  <label>graine <input id="banc-graine" type="number" step="1" value="1"></label>
  <label>sens
    <select id="banc-sens">
      <option value="raid">Raid</option>
      <option value="defense">Défense</option>
    </select>
  </label>
  <button id="banc-arsenal-ouvrir">Arsenal</button>
  <button id="banc-defense-ouvrir">Défense</button>
  <button id="banc-lancer">Lancer</button>
  <button id="banc-pause">Pause</button>
  <button id="banc-pas">Pas à pas</button>
  <button id="banc-rejouer">Rejouer</button>
  <button id="banc-legende">Légende</button>
  <button id="banc-v1">×1</button>
  <button id="banc-v2">×2</button>
  <button id="banc-v4">×4</button>
</header>
<main>
  <canvas id="banc-canvas"></canvas>
  <div id="banc-arsenal" hidden>
    <div class="palette" id="banc-palette"></div>
    <select id="banc-assaut" title="profil du bouton Remplir">
      <option value="infanterie">Infanterie</option>
      <option value="blindeLourd">Blindé lourd</option>
      <option value="mixte">Mixte</option>
    </select>
    <button id="banc-remplir">Remplir</button>
    <button id="banc-vider">Vider</button>
    <span id="banc-compteur"></span>
  </div>
  <div id="banc-defense" hidden>
    <div class="palette" id="banc-palette-defense"></div>
    <button id="banc-vider-defense">Vider</button>
    <span id="banc-compteur-defense"></span>
  </div>
  <div id="banc-tick"></div>
  <p id="banc-statut">initialisation…</p>
  <div id="banc-fin" hidden></div>
</main>
<script type="module">
// Point d'entrée du bundle : le banc d'essai du lot 3A. Toute la logique vit
// dans src/ui/banc.js — la page ne fait que l'appeler.
import { initialiserBanc } from './ui/banc.js';
initialiserBanc(document);
</script>
</body>
</html>
